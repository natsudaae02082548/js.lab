<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript Assignment</title>
</head>
<body>
<script>

// 1. ORDER CALCULATOR
// Calculate subtotal, 7% VAT, and total
const vat = 0.07;
function orderCalculator(price, quantity) {
   let subtotal = price * quantity;
   let vatAmount = subtotal * vat;
   let total = subtotal + vatAmount;
   return {
       subtotal: subtotal,
       vat: vatAmount,
       total: total
   };
}

// 2. DELIVERY RULE
// Use if / else if / else to calculate
// the delivery charge.
function deliveryCalculator(totalPrice, memberStatus) {
   let deliveryFee;
   if (totalPrice > 500) {
       deliveryFee = 0;
   }
   else if (memberStatus) {
       deliveryFee = 30;
   }
   else {
       deliveryFee = 50;
   }
   return deliveryFee;
}
// 3. CART TOTAL
// Loop through an array of prices
// and calculate the total.
function cartTotal(prices) {
   let total = 0;
   for (let i = 0; i < prices.length; i++) {
       total += prices[i];
   }
   return total;
}
// 4. DISCOUNT FUNCTION
// Calculate discount from an amount
// and a percentage.
function calculateDiscount(amount, percentage) {
   let discount = amount * (percentage / 100);
   return discount;
}

// 5. PRODUCT OBJECT
// Create an array of product objects.
let products = [
   {
       name: "Cake",
       price: 500,
       quantity: 20
   },
   {
       name: "Candy",
       price: 20,
       quantity: 300
   },
   {
       name: "Pudding",
       price: 100,
       quantity: 50
   }
];

// DISPLAY PRODUCT / ORDER DETAILS
document.write("<h1>JavaScript Lab Assignment</h1>");


// Product 1
let product1Result = orderCalculator(
   products[0].price,
   products[0].quantity
);
document.write("<h2>Order Details - Cake</h2>");
document.write("<p>Name: " + products[0].name + "</p>");
document.write("<p>Price: $" + products[0].price.toFixed(2) + "</p>");
document.write("<p>Quantity: " + products[0].quantity + "</p>");
document.write("<p>Subtotal: $" + product1Result.subtotal.toFixed(2) + "</p>");
document.write("<p>VAT 7%: $" + product1Result.vat.toFixed(2) + "</p>");
document.write("<p>Total: $" + product1Result.total.toFixed(2) + "</p>");

// Product 2
let product2Result = orderCalculator(
   products[1].price,
   products[1].quantity
);
document.write("<h2>Order Details - Candy</h2>");
document.write("<p>Name: " + products[1].name + "</p>");
document.write("<p>Price: $" + products[1].price.toFixed(2) + "</p>");
document.write("<p>Quantity: " + products[1].quantity + "</p>");
document.write("<p>Subtotal: $" + product2Result.subtotal.toFixed(2) + "</p>");
document.write("<p>VAT 7%: $" + product2Result.vat.toFixed(2) + "</p>");
document.write("<p>Total: $" + product2Result.total.toFixed(2) + "</p>");

//Product 3
let product3Result = orderCalculator(
   products[2].price,
   products[2].quantity
);
document.write("<h2>Order Details - Pudding</h2>");
document.write("<p>Name: " + products[2].name + "</p>");
document.write("<p>Price: $" + products[2].price.toFixed(2) + "</p>");
document.write("<p>Quantity: " + products[2].quantity + "</p>");
document.write("<p>Subtotal: $" + product3Result.subtotal.toFixed(2) + "</p>");
document.write("<p>VAT 7%: $" + product3Result.vat.toFixed(2) + "</p>");
document.write("<p>Total: $" + product3Result.total.toFixed(2) + "</p>");

// CART TOTAL
let prices = [];
for (let i = 0; i < products.length; i++) {
   prices.push(products[i].price * products[i].quantity);
}
let totalCart = cartTotal(prices);
document.write("<h2>Cart Total</h2>");
document.write("<p>Cart Total: $" + totalCart.toFixed(2) + "</p>");


// DISCOUNT
let discountPercentage = 10;
let discount = calculateDiscount(
   totalCart,
   discountPercentage
);
let priceAfterDiscount = totalCart - discount;
document.write("<h2>Discount</h2>");
document.write("<p>Original Total: $" + totalCart.toFixed(2) + "</p>");
document.write("<p>Discount: " + discountPercentage + "%</p>");
document.write("<p>Discount Amount: $" + discount.toFixed(2) + "</p>");
document.write("<p>Price After Discount: $" + priceAfterDiscount.toFixed(2) + "</p>");

// DELIVERY FEE
let memberStatus = true;
let deliveryFee = deliveryCalculator(
   priceAfterDiscount,
   memberStatus
);
document.write("<h2>Delivery Fee</h2>");
document.write("<p>Delivery Fee: $" + deliveryFee.toFixed(2) + "</p>");

// GRAND TOTAL
let grandTotal = priceAfterDiscount + deliveryFee;
document.write("<h2>Grand Total</h2>");
document.write("<p><strong>$" + grandTotal.toFixed(2) + "</strong></p>");

// PRODUCT LIST
// Print each product name and price
document.write("<h2>Product List</h2>");
for (let i = 0; i < products.length; i++) {
   document.write(
       "<p>" +
       products[i].name +
       " - $" +
       products[i].price.toFixed(2) +
       "</p>"
   );
}

// AI LOG
// AI Log: AI helped modify the existing JavaScript
// code and add order calculation, delivery rules,
// cart total, discount function, and product objects.
</script>
</body>
</html>
